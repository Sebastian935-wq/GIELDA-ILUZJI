name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 8.12 (bez potrzeby gradlew)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        run: gradle build --no-daemon

      - name: Wgraj gotowy .jar
        uses: actions/upload-artifact@v4
        with:
          name: gielda-iluzji
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
